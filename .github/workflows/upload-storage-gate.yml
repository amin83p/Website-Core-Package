name: Upload Storage Gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: upload-storage-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-storage-gate:
    name: Upload policy and boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run upload storage test suite
        env:
          CI: true
        run: npm run test:upload-storage
